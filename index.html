<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#352267"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Merge Hotel — Grand Merge</title>
<style>
:root{--deep:#33205f;--purple:#56358a;--gold:#ffd05f;--cream:#fff0d9;--ink:#49385e;--board:#9eacd9;--tile:#aebbe6;--tile2:#9eacd9;--pink:#f5b4c5}
*{box-sizing:border-box}html,body{margin:0;background:#211640;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;border:0;cursor:pointer;color:inherit}.game{max-width:480px;margin:auto;min-height:100dvh;background:linear-gradient(180deg,#7e68b3 0,#b88ebc 13%,#f4d6d0 26%,#f6e8e1 100%);padding-bottom:calc(75px + env(safe-area-inset-bottom));overflow:hidden;position:relative}
.top{height:63px;padding:6px 7px;display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#392465,#60418f);box-shadow:0 3px 8px #1b103c66;color:#fff}.profile{width:43px;height:43px;flex:none;border:2px solid #ffd46d;border-radius:12px;background:#f8d8ca;overflow:hidden;display:grid;place-items:center}.profile img{width:100%;height:100%;object-fit:cover}.resource{height:34px;min-width:0;flex:1;background:linear-gradient(#fff6dd,#f2d49f);border:2px solid #b98649;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:4px;color:#5b3d5d;font-weight:1000;font-size:13px;box-shadow:0 2px 0 #2a194d}.resource .symbol{font-size:18px}.plus{font-size:13px;color:#25a35e;background:#fff;border-radius:50%;width:16px;height:16px;display:grid;place-items:center}.gear{flex:none;width:32px;height:32px;border-radius:50%;background:#f8e2bd;border:2px solid #b98b52;font-size:17px}
.eventline{height:26px;padding:4px 10px;display:flex;justify-content:space-between;align-items:center;color:white;text-shadow:0 1px 2px #49316b;font-size:10px;font-weight:900}.eventline .pill{background:#52347cbb;border:1px solid #f6d28d;border-radius:20px;padding:2px 8px}
.orders{display:flex;gap:6px;overflow-x:auto;padding:3px 7px 9px;scrollbar-width:none;scroll-snap-type:x mandatory}.orders::-webkit-scrollbar{display:none}.order{scroll-snap-align:start;flex:0 0 31.5%;min-width:0;min-height:94px;background:linear-gradient(145deg,#fff4df,#f3d4c9);border:2px solid #bd8b82;border-radius:12px 12px 8px 8px;box-shadow:0 3px 0 #755078,0 4px 6px #40255255;padding:4px 5px 5px;position:relative}.order-top{display:flex;align-items:center;gap:4px}.avatar{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid #e4b75d;background:linear-gradient(145deg,#fce4c9,#d99db3);display:grid;place-items:center;font-size:22px}.guestname{font-size:9px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.order-items{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:2px}.order-item{width:34px;height:32px;position:relative;background:#fff8e9;border:1px solid #e4c8a9;border-radius:7px;padding:1px}.order-item img{width:100%;height:100%;object-fit:contain}.order-item small{position:absolute;bottom:-3px;right:-2px;background:#67447e;color:#fff;border-radius:8px;font-size:8px;padding:0 3px}.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:9px;font-weight:1000;color:#94651e}.order.done{opacity:.5}.order.done:after{content:'✓';position:absolute;right:6px;top:5px;color:#27a66d;font-size:19px;font-weight:1000}
.board-title{height:22px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 1px 2px #51326d;font-size:10px;font-weight:1000}.boardframe{margin:0 7px;background:linear-gradient(135deg,#d4d0ef,#aab6e1);border:3px solid #735d9b;border-radius:10px;padding:4px;box-shadow:0 4px 0 #49326e,0 6px 12px #39214b55}.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.cell{aspect-ratio:1;min-width:0;background:linear-gradient(145deg,var(--tile),var(--tile2));border:1px solid #8792c1;border-radius:5px;position:relative;display:grid;place-items:center;padding:1px;touch-action:manipulation;overflow:hidden}.cell.empty{background:linear-gradient(145deg,#aab4dd,#9ba7d2);box-shadow:inset 0 1px 3px #6775ad66}.cell.selected{outline:3px solid #ffe06c;outline-offset:-2px;filter:brightness(1.12);z-index:2}.cell img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 1px #56466b55);pointer-events:none}.cell.generator{background:linear-gradient(145deg,#f9dca0,#e6b36e);border:1px solid #b77b3d;box-shadow:inset 0 1px 2px #fff9}.cell.generator:after{content:'⚡';position:absolute;top:1px;right:2px;font-size:9px;text-shadow:0 1px #fff}.cell .lv{position:absolute;bottom:1px;right:2px;font-size:8px;color:#fff;background:#5c477b;border-radius:4px;padding:0 3px;font-weight:1000}.cell.pop{animation:pop .23s ease}@keyframes pop{50%{transform:scale(1.14);filter:brightness(1.35)}}
.energybar{height:5px;background:#57417c;margin:5px 10px 0;border-radius:5px;overflow:hidden}.energybar i{height:100%;display:block;background:linear-gradient(90deg,#fff17c,#ffb13c)}.selected-panel{margin:7px 8px 0;background:linear-gradient(#fff5e6,#f1d5c8);border:2px solid #c58e78;border-radius:11px;min-height:51px;display:flex;align-items:center;gap:7px;padding:4px 7px;box-shadow:0 2px 0 #966b7b}.selected-icon{width:42px;height:42px;flex:none;display:grid;place-items:center}.selected-icon img{width:100%;height:100%;object-fit:contain}.selected-text{flex:1;min-width:0;font-size:10px;line-height:1.2}.selected-text b{font-size:11px}.selected-text span{display:block;color:#80687a;margin-top:3px}.action{background:linear-gradient(#fff1a5,#f6b94f);border:2px solid #bb8039;border-radius:9px;padding:7px 8px;color:#633d36;font-size:9px;font-weight:1000;box-shadow:0 2px 0 #8c5934}.toolbar{display:flex;gap:5px;margin:7px 8px}.tool{flex:1;background:linear-gradient(#fff0d8,#e9c9e4);border:2px solid #a88bc4;border-radius:9px;padding:7px 2px;font-size:9px;font-weight:1000;color:#55406d;box-shadow:0 2px 0 #7d6399}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:flex;justify-content:space-around;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(#684b91,#3b286a);border-top:2px solid #d7a9c4;z-index:5}.nav button{background:transparent;color:#ffe9cf;font-size:9px;font-weight:1000;display:grid;justify-items:center;gap:2px}.nav b{font-size:21px}
.toast{position:fixed;top:68px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#4a2c71;color:#fff;padding:8px 13px;border:2px solid #ffd26d;border-radius:22px;font-size:11px;font-weight:1000;z-index:40;transition:.2s;white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#1d123bc9;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal.show{display:flex}.modalbox{background:linear-gradient(#fff4e3,#f2d9d2);border:3px solid #d9a45d;border-radius:18px;padding:16px;text-align:center;max-width:360px;width:100%;max-height:85dvh;overflow:auto;box-shadow:0 12px 35px #160b2b99}.modalbox h3{margin:4px 0 8px;font-size:18px}.modalbox p{font-size:11px;line-height:1.45;color:#715d72}.modalbox button{margin-top:10px;background:#6a478f;color:#fff;padding:10px 25px;border-radius:11px;font-weight:1000}.recipe-path{display:flex;align-items:center;justify-content:center;gap:5px;margin:12px 0;flex-wrap:wrap}.recipe-step{width:58px;background:#fff9ed;border:1px solid #d9c2ad;border-radius:9px;padding:5px 3px}.recipe-step img{width:42px;height:42px;object-fit:contain}.recipe-step small{display:block;font-size:8px;font-weight:900}.recipe-arrow{font-size:16px;color:#a56c2d;font-weight:1000}.recipe-gen{display:flex;align-items:center;gap:10px;background:#fff8eb;border-radius:10px;padding:7px;margin-top:10px;text-align:left}.recipe-gen img{width:62px;height:62px;object-fit:contain}.recipe-gen b{font-size:11px}.recipe-gen small{display:block;font-size:9px;color:#7c6878;margin-top:3px}
@media(max-width:360px){.top{gap:3px;padding-inline:5px}.resource{font-size:11px}.profile{width:38px;height:38px}.order{flex-basis:34%}.board{gap:2px}.cell{border-radius:4px}.selected-icon{width:36px;height:36px}}
</style></head><body><div class="game">
<header class="top"><div class="profile"><img src="assets/hostess.webp" alt="Профиль"></div><div class="resource"><span class="symbol">⚡</span><span id="energy">80/100</span><span class="plus" id="addEnergy">+</span></div><div class="resource"><span class="symbol">🪙</span><span id="coins">3680</span><span class="plus">+</span></div><div class="resource"><span class="symbol">💎</span><span id="gems">92</span><span class="plus">+</span></div><button class="gear" id="settings">⚙️</button></header>
<div class="eventline"><span id="level">✦ УРОВЕНЬ 12</span><span class="pill">🎁 СОБЫТИЕ · 2д 14ч</span><span>🏆 <span id="xp">120</span></span></div>
<div class="orders" id="orders" aria-label="Заказы гостей"></div>
<div class="board-title"><span>ИГРОВОЕ ПОЛЕ · MERGE HOTEL</span><span id="boardCount">0 / 56</span></div>
<div class="boardframe"><div class="board" id="board"></div></div>
<div class="energybar"><i id="energyFill" style="width:80%"></i></div>
<div class="selected-panel"><div class="selected-icon" id="selectedIcon">✨</div><div class="selected-text"><b id="selectedTitle">Выбери предмет или генератор</b><span id="selectedDesc">Нажми на генератор на поле, чтобы получить предметы. Одинаковые предметы объединяются.</span></div><button class="action" id="mainAction">КАК ИГРАТЬ</button></div>
<div class="toolbar"><button class="tool" id="sell">🪙 Продать</button><button class="tool" id="hint">✨ Подсказка</button><button class="tool" id="storage">📦 Склад</button><button class="tool" id="shop">🛍 Магазин</button></div>
<nav class="nav"><button data-tab="tasks"><b>📋</b>ЗАДАНИЯ</button><button data-tab="hotel"><b>🏨</b>ОТЕЛЬ</button><button data-tab="collection"><b>📖</b>КОЛЛЕКЦИЯ</button><button data-tab="events"><b>🎁</b>СОБЫТИЯ</button></nav>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><div style="font-size:38px" id="modalIcon">🎉</div><h3 id="modalTitle">Отлично!</h3><div id="modalBody"><p id="modalText"></p></div><button id="modalOk">Продолжить</button></div></div>
</div>
<script>
(()=>{
const N=56, MAX=100;
const itemData={
 tea:{name:'Чайная церемония',items:[['tea','Чай'],['croissant','Круассан'],['cake','Пирожное'],['cloche','Сервировочный клош']],gen:'gen_coffee',genName:'Кофейная станция'},
 linen:{name:'Гостевой сервис',items:[['towels','Полотенца'],['laundry','Корзина белья'],['suitcase','Чемодан'],['trolley','Багажная тележка']],gen:'gen_laundry',genName:'Прачечная'},
 beauty:{name:'Уход и косметика',items:[['perfume','Парфюм'],['spray','Спрей'],['bell','Сервисный звонок'],['key','Ключ от номера']],gen:'gen_vanity',genName:'Столик косметолога'},
 garden:{name:'Сад и интерьер',items:[['roses','Букет роз'],['topiary','Топиарий'],['armchair','Кресло'],['lamp','Настенное бра']],gen:'gen_garden',genName:'Садовая оранжерея'}
};
const genDefs=[{id:'tea',name:'Кофейная станция',img:'gen_coffee',cost:1},{id:'linen',name:'Прачечная',img:'gen_laundry',cost:1},{id:'beauty',name:'Столик косметолога',img:'gen_vanity',cost:1},{id:'garden',name:'Садовая оранжерея',img:'gen_garden',cost:1}];
const guests=[['👩🏻‍🦰','Эмма'],['👨🏻','Браун'],['👩🏽‍🦱','Лили'],['🧑🏻‍🍳','Марко'],['👵🏻','Роуз'],['👨🏽','Даниэль'],['👩🏼','Софи']];
let S={energy:80,coins:3680,gems:92,xp:120,board:Array(N).fill(null),selected:null,orders:[],guestSeed:0,turn:0};
const $=id=>document.getElementById(id);const asset=name=>'assets/'+name+'.png';const genAsset=name=>'assets/'+name+'.webp';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1450)}
function save(){localStorage.setItem('mergeHotelGrandV4',JSON.stringify(S))}
function load(){try{let s=JSON.parse(localStorage.getItem('mergeHotelGrandV4'));if(s&&s.board?.length===N)S={...S,...s}}catch(e){}}
function empty(){return S.board.findIndex(x=>!x)}
function newOrder(){let keys=Object.keys(itemData),key=keys[(S.guestSeed*7+Math.floor(Math.random()*keys.length))%keys.length],level=2+Math.floor(Math.random()*3),guest=guests[S.guestSeed%guests.length];S.guestSeed++;return {guest,chain:key,level,coins:90+level*55,done:false}}
function ensureOrders(){while(S.orders.length<6)S.orders.push(newOrder())}
function iconFor(o){if(!o)return '';if(o.type==='gen')return genAsset(o.gen);return asset(itemData[o.chain].items[o.level-1][0])}
function itemName(o){if(!o)return '';return o.type==='gen'?itemData[o.chain].genName:itemData[o.chain].items[o.level-1][1]}
function addItem(chain,level=1){let i=empty();if(i<0)return false;S.board[i]={type:'item',chain,level};return true}
function render(){
 $('energy').textContent=S.energy+'/100';$('coins').textContent=S.coins.toLocaleString('ru-RU');$('gems').textContent=S.gems;$('xp').textContent=S.xp;$('level').textContent='✦ УРОВЕНЬ '+(12+Math.floor(S.xp/100));$('energyFill').style.width=S.energy+'%';$('boardCount').textContent=S.board.filter(Boolean).length+' / 56';
 const board=$('board');board.innerHTML='';S.board.forEach((o,i)=>{let b=document.createElement('button');b.className='cell '+(!o?'empty':'')+(o?.type==='gen'?' generator':'')+(S.selected===i?' selected':'');if(o){b.innerHTML=`<img src="${iconFor(o)}" alt="${itemName(o)}"><span class="lv">${o.type==='gen'?'⚡':('Ур.'+o.level)}</span>`;b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',String(i));}b.onclick=()=>tap(i);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let from=Number(e.dataTransfer.getData('text/plain'));merge(from,i)};board.appendChild(b)});
 const orders=$('orders');orders.innerHTML='';S.orders.forEach((o,i)=>{let data=itemData[o.chain],el=document.createElement('div');el.className='order'+(o.done?' done':'');el.innerHTML=`<div class="order-top"><div class="avatar">${o.guest[0]}</div><div class="guestname">${o.guest[1]}</div></div><div class="order-items"><button class="order-item" aria-label="Показать рецепт"><img src="${asset(data.items[o.level-1][0])}"><small>1/${o.level}</small></button></div><div class="order-foot"><span>🪙 +${o.coins}</span><span>☝ Рецепт</span></div>`;el.querySelector('.order-item').onclick=()=>showRecipe(o);orders.appendChild(el)});
 let o=S.selected===null?null:S.board[S.selected];if(o){$('selectedIcon').innerHTML=`<img src="${iconFor(o)}">`;$('selectedTitle').textContent=itemName(o)+(o.type==='gen'?' · генератор':' · уровень '+o.level);$('selectedDesc').textContent=o.type==='gen'?'Нажми ещё раз, чтобы запустить генератор. Он создаёт предметы и расходует энергию.':`Цепочка: ${itemData[o.chain].name}. Объединяй два одинаковых предмета уровня ${o.level}.`;$('mainAction').textContent=o.type==='gen'?'ПРОИЗВЕСТИ':'РЕЦЕПТ'}else{$('selectedIcon').textContent='✨';$('selectedTitle').textContent='Выбери предмет или генератор';$('selectedDesc').textContent='Генераторы стоят прямо на поле. Нажми на них, чтобы производить предметы.';$('mainAction').textContent='КАК ИГРАТЬ'}
 save();
}
function tap(i){let o=S.board[i];if(!o){S.selected=null;render();return}if(o.type==='gen'){if(S.selected===i)produce(i);else{S.selected=i;render();toast('Нажми ещё раз, чтобы запустить генератор')}return}if(S.selected===null||!S.board[S.selected]||S.board[S.selected].type==='gen'){S.selected=i;render();return}if(S.selected===i){S.selected=null;render();return}merge(S.selected,i)}
function produce(i){let gen=S.board[i];if(!gen||gen.type!=='gen')return;if(S.energy<1){toast('Недостаточно энергии');return}let free=empty();if(free<0){toast('Нет свободной клетки на поле');return}S.energy-=1;S.board[free]={type:'item',chain:gen.chain,level:1};S.selected=free;render();let cell=$('board').children[free];cell?.classList.add('pop');toast('Генератор произвёл предмет!')}
function merge(a,b){if(a===b||!S.board[a]||!S.board[b])return;let x=S.board[a],y=S.board[b];if(x.type==='item'&&y.type==='item'&&x.chain===y.chain&&x.level===y.level){let next=Math.min(4,x.level+1);S.board[b]={type:'item',chain:x.chain,level:next};S.board[a]=null;S.selected=b;S.xp+=3;toast('Слияние! '+itemData[x.chain].items[next-1][1]);checkOrders();render();$('board').children[b]?.classList.add('pop')}else{S.selected=b;render();toast('Объединяй два одинаковых предмета одного уровня')}}
function checkOrders(){for(let i=0;i<S.orders.length;i++){let o=S.orders[i];if(o.done)continue;let idx=S.board.findIndex(x=>x&&x.type==='item'&&x.chain===o.chain&&x.level>=o.level);if(idx>=0){S.board[idx]=null;o.done=true;S.coins+=o.coins;S.xp+=18;toast('Заказ выполнен! +'+o.coins+' монет');S.orders[i]=newOrder();break}}}
function showRecipe(o){let d=itemData[o.chain],parts=d.items.slice(0,o.level);$('modalIcon').textContent='📖';$('modalTitle').textContent='Как получить: '+d.items[o.level-1][1];$('modalBody').innerHTML=`<p>Цепочка «${d.name}». Каждый следующий предмет получается слиянием двух одинаковых предметов предыдущего уровня.</p><div class="recipe-path">${parts.map((it,i)=>`${i?'<span class="recipe-arrow">＋</span>':''}<div class="recipe-step"><img src="${asset(it[0])}"><small>Ур. ${i+1}<br>${it[1]}</small></div>`).join('')}</div><p><b>Правило слияния:</b> два предмета одного уровня → один предмет следующего уровня.</p><div class="recipe-gen"><img src="${genAsset(d.gen)}"><div><b>${d.genName}</b><small>Находится на игровом поле. Нажимай на генератор, чтобы получать предметы этой цепочки. Стоимость: 1 ⚡ за предмет.</small></div></div>`;$('modal').classList.add('show')}
function showModal(icon,title,text){$('modalIcon').textContent=icon;$('modalTitle').textContent=title;$('modalBody').innerHTML=`<p>${text}</p>`;$('modal').classList.add('show')}
$('modalOk').onclick=()=>$('modal').classList.remove('show');$('mainAction').onclick=()=>{let o=S.selected===null?null:S.board[S.selected];if(o?.type==='gen')produce(S.selected);else if(o)showRecipe({chain:o.chain,level:o.level});else showModal('💡','Как играть','Нажимай на генераторы на поле, чтобы создавать предметы. Объединяй две одинаковые вещи одного уровня. Нажимай на предмет в заказе, чтобы увидеть рецепт.')};
$('sell').onclick=()=>{let o=S.selected===null?null:S.board[S.selected];if(!o||o.type!=='item'){toast('Выбери предмет, который хочешь продать');return}S.coins+=o.level*35;S.board[S.selected]=null;S.selected=null;render();toast('Предмет продан')};
$('hint').onclick=()=>{for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){let a=S.board[i],b=S.board[j];if(a&&b&&a.type==='item'&&b.type==='item'&&a.chain===b.chain&&a.level===b.level){S.selected=i;render();toast('Нашлась пара для слияния');return}}toast('Подходящих пар пока нет')};
$('storage').onclick=()=>showModal('📦','Склад','Склад будет расширен в следующем обновлении. Сейчас освобождай клетки слиянием предметов или продажей лишнего.');$('shop').onclick=()=>showModal('🛍','Магазин','Здесь появятся дополнительные бустеры, энергия и декоративные наборы.');$('settings').onclick=()=>showModal('⚙️','Настройки','Прогресс автоматически сохраняется на этом устройстве.');$('addEnergy').onclick=()=>{if(S.gems>=5&&S.energy<100){S.gems-=5;S.energy=Math.min(100,S.energy+20);render();toast('+20 энергии')}else toast('Нужно 5 кристаллов или дождись восстановления энергии')};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{let t=b.dataset.tab;let labels={tasks:['📋','Задания','Выполняй заказы гостей, чтобы получать монеты и опыт.'],hotel:['🏨','Отель «Гранд»','Заказы и прогресс будут открывать новые зоны отеля.'],collection:['📖','Коллекция','Открывай все четыре цепочки, объединяя предметы до четвёртого уровня.'],events:['🎁','События','Сезонные события и специальные задания появятся в следующих обновлениях.']};showModal(...labels[t])});
function init(){load();if(!S.board.some(Boolean)){// Four permanent generators embedded in the board
 S.board[3]={type:'gen',chain:'tea'};S.board[10]={type:'gen',chain:'linen'};S.board[45]={type:'gen',chain:'beauty'};S.board[52]={type:'gen',chain:'garden'};
 [[0,0,1],[1,0,1],[2,0,1],[3,0,1],[4,1,1],[5,1,1],[6,1,1],[7,2,1],[8,2,1],[9,2,1],[11,3,1],[12,3,1],[13,3,1],[14,0,2],[15,1,2],[16,2,2],[17,3,2],[18,0,1],[19,1,1]].forEach(([idx,c,l])=>S.board[idx]={type:'item',chain:['tea','linen','beauty','garden'][c],level:l});ensureOrders();}else ensureOrders();render()}
init();setInterval(()=>{if(S.energy<MAX){S.energy++;$('energy').textContent=S.energy+'/100';$('energyFill').style.width=S.energy+'%';save()}},90000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
